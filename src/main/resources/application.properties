spring.application.name=LaundryLink

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=laundryLinkDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Admin@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
spring.config.import=optional:classpath:application-local.properties

# Email recovery: set these environment variables on the machine running Spring Boot.
# No SMTP host means recovery reports unavailable; it never claims a fake send.
spring.mail.host=${LAUNDRYLINK_SMTP_HOST:}
spring.mail.port=${LAUNDRYLINK_SMTP_PORT:587}
spring.mail.username=${LAUNDRYLINK_SMTP_USERNAME:}
spring.mail.password=${LAUNDRYLINK_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${LAUNDRYLINK_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${LAUNDRYLINK_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${LAUNDRYLINK_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
laundrylink.recovery.from=${LAUNDRYLINK_SMTP_FROM:}
laundrylink.recovery.base-url=${LAUNDRYLINK_BASE_URL:http://localhost:8080}
