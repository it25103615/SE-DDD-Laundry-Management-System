<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Processing Board | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
    <!-- Live data: orders come from GET /api/processing/orders (see processing-board.js). -->
    <script src="../../js/staff/processing-api.js" defer></script>
    <script src="../../js/staff/processing-board.js" defer></script>
  </head>
  <body>
    <nav class="dashboard_nav"></nav>
    <main>
      <header class="page_header">
        <div class="subtitle">FACILITY WORKFLOW</div>
        <h1>Processing Board</h1>
        <p>Orders currently moving through the laundry facility. Open an order to move it to its next stage.</p>
      </header>
      <!-- View switch sits above the board it controls; processing-board.js wires it up.
           It deliberately has no type="button": global-post.js adds a placeholder toast to every
           button[type="button"], and outside a <form> a plain button does nothing by default. -->
      <div class="top_bar board_toolbar">
        <span id="board-count"></span>
        <button
          id="view-toggle"
          class="custom_button custom_button_nobg"
          aria-pressed="false"
        >
          List view
        </button>
      </div>
      <div id="notice" class="alert" hidden></div>
      <!-- One column per stage; processing-board.js fills them in. -->
      <section id="board" class="board_columns" aria-label="Order processing stages">
        <p class="muted">Loading orders…</p>
      </section>
    </main>
  </body>
</html>
