<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Receive Items | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
    <!-- Live data: GET /api/processing/orders/{id} and POST .../receive (see receive-items.js). -->
    <script src="../../js/staff/processing-api.js" defer></script>
    <script src="../../js/staff/receive-items.js" defer></script>
  </head>
  <body>
    <nav class="dashboard_nav"></nav>
    <main>
      <header class="page_header">
        <div class="subtitle">INBOUND ORDERS</div>
        <h1>Receive Items</h1>
        <p>Count the items in an order that has arrived at the shop and check them against the order.</p>
      </header>
      <!-- Step 1: choose the order. (action is set so global-post.js leaves the form alone.) -->
      <form id="find-form" class="card" action="receive_items.html">
        <div class="field">
          <label for="order-number">Order number</label
          ><!-- Filled by receive-items.js with the orders that are In Shop and waiting to be received. -->
          <select class="input" id="order-number" name="orderId" required>
            <option value="">Loading orders…</option>
          </select>
        </div>
        <button class="custom_button custom_button_bg" type="submit">
          Get order details
        </button>
      </form>
      <div id="notice" class="alert" hidden style="margin-top: 24px"></div>
      <!-- Step 2: count every line; shown once an order is loaded. -->
      <section id="order-section" style="margin-top: 35px" hidden>
        <div class="top_bar">
          <div>
            <h2 id="order-title">Order</h2>
            <p class="muted" id="order-summary"></p>
          </div>
          <span id="order-status"></span>
        </div>
        <form id="receive-form" action="receive_items.html" novalidate>
          <div class="table_wrap">
            <table>
              <thead>
                <tr>
                  <th>EXPECTED ITEM</th>
                  <th>SERVICE</th>
                  <th>QTY</th>
                  <th>RECEIVED</th>
                  <th>CONDITION</th>
                </tr>
              </thead>
              <tbody id="line-rows"></tbody>
            </table>
          </div>
          <label class="check_row"
            ><input id="counted" type="checkbox" />I have counted and checked all
            received items.</label
          ><button id="confirm-button" class="custom_button custom_button_bg" type="submit">
            Confirm receipt
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
