<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Receive Items | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body>
    <nav class="dashboard_nav">
      <ul class="navigation">
        <li class="logo">
          <a href="dashboard.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="dashboard.html">Dashboard</a
          ><a href="processing_board.html">Processing Board</a
          ><a href="receive_items.html">Receive Items</a
          ><a href="issue_reports.html">Issue Reports</a
          ><span class="profile_badge">NS</span>
        </li>
      </ul>
    </nav>
    <main>
      <header class="page_header">
        <div class="subtitle">INBOUND ORDERS</div>
        <h1>Receive Items</h1>
        <p>Verify incoming bags against the customer's order.</p>
      </header>
      <form class="card">
        <div class="grid grid_two">
          <div class="field">
            <label for="order-number">Order number</label
            ><input
              class="input"
              id="order-number"
              name="order_number"
              required
              placeholder="#1042"
            />
          </div>
          <div class="field">
            <label for="bag-count">Number of bags</label
            ><input
              class="input"
              id="bag-count"
              name="bag_count"
              type="number"
              min="1"
              required
            />
          </div>
        </div>
        <button class="custom_button custom_button_bg" type="submit">
          Find order
        </button>
      </form>
      <section style="margin-top: 35px">
        <div class="top_bar">
          <div>
            <h2>Order #1042</h2>
            <p class="muted">Priya Fernando · Expected 6 items</p>
          </div>
          <span class="status">AWAITING RECEIPT</span>
        </div>
        <form>
          <div class="table_wrap">
            <table>
              <thead>
                <tr>
                  <th>EXPECTED ITEM</th>
                  <th>QTY</th>
                  <th>RECEIVED</th>
                  <th>CONDITION</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Shirts</td>
                  <td>4</td>
                  <td>
                    <input
                      class="input"
                      type="number"
                      min="0"
                      value="4"
                      aria-label="Shirts received"
                    />
                  </td>
                  <td>
                    <select class="input" aria-label="Shirt condition">
                      <option>As expected</option>
                      <option>Stained</option>
                      <option>Damaged</option>
                    </select>
                  </td>
                </tr>
                <tr>
                  <td>Trousers</td>
                  <td>2</td>
                  <td>
                    <input
                      class="input"
                      type="number"
                      min="0"
                      value="2"
                      aria-label="Trousers received"
                    />
                  </td>
                  <td>
                    <select class="input" aria-label="Trouser condition">
                      <option>As expected</option>
                      <option>Stained</option>
                      <option>Damaged</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <label class="check_row"
            ><input type="checkbox" required />I have counted and checked all
            received items.</label
          ><button class="custom_button custom_button_bg" type="submit">
            Confirm receipt
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
