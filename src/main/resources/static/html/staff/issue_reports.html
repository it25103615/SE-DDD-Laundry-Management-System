<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Issue Reports | LaundryLink</title>
    <style>#new-report[hidden], #submit-report-link[hidden] { display: none !important; }</style>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
    <!-- Live data: GET/POST /api/processing/issues (see issue-reports.js). -->
    <script src="../../js/staff/processing-api.js" defer></script>
    <script src="../../js/staff/issue-reports.js" defer></script>
  </head>
  <body>
    <nav class="dashboard_nav"></nav>
    <main>
      <header class="page_header top_bar">
        <div>
          <div class="subtitle">FACILITY QUALITY</div>
          <h1>Issue Reports</h1>
          <p id="issue-description">Review damaged, missing or mismatched items reported by laundry staff. Each report is linked to a customer-service case.</p>
        </div>
        <a id="submit-report-link" hidden class="custom_button custom_button_bg" href="#new-report"
          >Submit report</a
        >
      </header>
      <div id="notice" class="alert" hidden style="margin-bottom: 22px"></div>
      <div class="table_wrap">
        <table>
          <thead>
            <tr>
              <th>CASE</th>
              <th>ORDER</th>
              <th>ITEM</th>
              <th>ISSUE</th>
              <th>REPORTED</th>
              <th>CASE STATUS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="issue-rows">
            <tr><td colspan="7" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <!-- action is set so global-post.js leaves the form alone; issue-reports.js submits it. -->
      <form id="new-report" hidden class="card" style="margin-top: 40px" action="issue_reports.html">
        <h2>New issue report</h2>
        <div class="grid grid_two">
          <div class="field">
            <label for="order">Order number</label
            ><input class="input" id="order" name="order" required inputmode="numeric" placeholder="e.g. 6" />
          </div>
          <div class="field">
            <label for="item">Item</label
            ><select class="input" id="item" name="item">
              <option value="">Whole order</option>
            </select>
          </div>
          <div class="field">
            <label for="issue">Issue type</label
            ><select class="input" id="issue" name="issue" required>
              <option value="">Choose an issue</option>
              <option>Damaged item</option>
              <option>Existing stain</option>
              <option>Missing item</option>
              <option>Item count mismatch</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="details">Details</label
          ><textarea
            class="input"
            id="details"
            name="details"
            required
            maxlength="250"
          ></textarea>
        </div>
        <button class="custom_button custom_button_bg" type="submit">
          Submit report
        </button>
      </form>
    </main>
  </body>
</html>
