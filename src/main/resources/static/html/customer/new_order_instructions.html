<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Order Instructions | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body>
    <nav class="dashboard_nav">
      <ul class="navigation">
        <li class="logo">
          <a href="dashboard.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="dashboard.html">Cancel order</a
          ><span class="profile_badge">PF</span>
        </li>
      </ul>
    </nav>
    <main>
      <header class="page_header">
        <div class="subtitle">NEW ORDER</div>
        <h1>Anything we should know?</h1>
        <p>Add preferences or handling instructions for the laundry team.</p>
      </header>
      <ol class="step_list">
        <li class="done">1 Services</li>
        <li class="done">2 Items</li>
        <li class="done">3 Schedule</li>
        <li class="active">4 Instructions</li>
        <li>5 Review</li>
      </ol>
      <form action="new_order_review.html" method="get">
        <div class="grid grid_two">
          <section class="card">
            <h2>Preferences</h2>
            <label class="check_row"
              ><input
                type="checkbox"
                name="preference"
                value="fragrance-free"
              />Fragrance-free detergent</label
            ><label class="check_row"
              ><input
                type="checkbox"
                name="preference"
                value="hypoallergenic"
              />Hypoallergenic detergent</label
            ><label class="check_row"
              ><input
                type="checkbox"
                name="preference"
                value="hang-dry"
              />Hang-dry delicate items</label
            ><label class="check_row"
              ><input type="checkbox" name="preference" value="hangers" />Return
              shirts on hangers</label
            >
          </section>
          <section class="card">
            <h2>Special instructions</h2>
            <div class="field">
              <label for="instructions">Notes for our team (optional)</label
              ><textarea
                class="input"
                id="instructions"
                name="instructions"
                maxlength="500"
                placeholder="For example: please treat the stain on the blue shirt collar."
              ></textarea>
            </div>
          </section>
        </div>
        <div class="actions">
          <a
            class="custom_button custom_button_nobg"
            href="new_order_schedule.html"
            >← Back</a
          ><button class="custom_button custom_button_bg" type="submit">
            Review order
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
