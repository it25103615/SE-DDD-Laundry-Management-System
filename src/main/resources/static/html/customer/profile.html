<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body>
    <nav class="dashboard_nav">
      <ul class="navigation">
        <li class="logo">
          <a href="dashboard.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="dashboard.html">Dashboard</a
          ><a href="my_orders.html">My Orders</a
          ><span class="profile_badge">PF</span>
        </li>
      </ul>
    </nav>
    <main>
      <header class="page_header">
        <div class="subtitle">YOUR ACCOUNT</div>
        <h1>Profile</h1>
        <p>Update your personal and security details.</p>
      </header>
      <div class="account_layout">
        <nav class="side_navigation">
          <a href="my_orders.html">My Orders</a
          ><a href="payments.html">Payments</a
          ><a href="addresses.html">Addresses</a
          ><a class="active" href="profile.html">Profile</a
          ><a href="feedback.html">Feedback &amp; Complaints</a>
        </nav>
        <section>
          <form>
            <h2>Personal details</h2>
            <div class="grid grid_two">
              <div class="field">
                <label for="name">Full name</label
                ><input
                  class="input"
                  id="name"
                  name="name"
                  value="Priya Fernando"
                  required
                />
              </div>
              <div class="field">
                <label for="phone">Phone number</label
                ><input
                  class="input"
                  id="phone"
                  name="phone"
                  type="tel"
                  value="+94 77 123 4567"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label for="email">Email</label
              ><input
                class="input"
                id="email"
                name="email"
                type="email"
                value="priya@example.com"
                required
              />
            </div>
            <button class="custom_button custom_button_bg" type="submit">
              Save changes
            </button>
          </form>
          <form style="margin-top: 45px">
            <h2>Update password</h2>
            <div class="field">
              <label for="current-password">Current password</label
              ><input
                class="input"
                id="current-password"
                name="current_password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
            <div class="grid grid_two">
              <div class="field">
                <label for="new-password">New password</label
                ><input
                  class="input"
                  id="new-password"
                  name="new_password"
                  type="password"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
              </div>
              <div class="field">
                <label for="confirm-password">Confirm password</label
                ><input
                  class="input"
                  id="confirm-password"
                  name="confirm_password"
                  type="password"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
              </div>
            </div>
            <button class="custom_button custom_button_bg" type="submit">
              Update password
            </button>
          </form>
          <div style="margin-top: 45px">
            <h2 class="danger">Deactivate account</h2>
            <p class="muted">
              This prevents future orders until your account is reactivated.
            </p>
            <button
              class="custom_button custom_button_border danger"
              type="button"
            >
              Deactivate account
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
