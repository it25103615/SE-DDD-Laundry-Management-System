<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schedule Pickup | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <!-- Reused from the profile page for the add-address pop-up (.address-dialog, .profile-message). -->
    <link rel="stylesheet" href="../../css/account/profile-live.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
    <style>
      .schedule-time-card:hover {
        transform: none;
      }
      /* Keep native time-window popups opaque and stable when focused. */
      #pickup-time {
        color-scheme: light;
        color: var(--color-text, #102a3b);
        background-color: #fff;
        transform: none;
      }
      #pickup-time option {
        color: var(--color-text, #102a3b);
        background-color: #fff;
      }
      #pickup-time option:disabled {
        color: #667783;
      }
      /* Add-address pop-up: tighter spacing than a full page form. */
      #new-address-dialog .field {
        margin: 16px 0;
      }
      #new-address-dialog .actions {
        margin-top: 18px;
      }
      #add-address-button {
        margin-top: 12px;
      }
      /* .custom_button sets its own display, which would otherwise override the hidden attribute. */
      #add-address-button[hidden] {
        display: none;
      }
    </style>

  </head>
  <body>
    <nav class="dashboard_nav" data-nav="flow"
         data-exit-label="Cancel order" data-exit-href="/html/customer/dashboard.html"></nav>
    <main>
      <header class="page_header">
        <div class="subtitle">NEW ORDER</div>
        <h1>When and where?</h1>
        <p>Choose a pickup slot and confirm the collection address.</p>
      </header>
      <ol class="step_list">
        <li class="done">1 Services</li>
        <li class="done">2 Items</li>
        <li class="active">3 Schedule</li>
        <li>4 Instructions</li>
        <li>5 Review</li>
      </ol>
      <form action="new_order_instructions.html" method="get">
        <div class="grid grid_two">
          <section class="card schedule-time-card">
            <h2>Pickup time</h2>
            <div class="field">
              <label for="pickup-date">Date</label
              ><input
                class="input"
                id="pickup-date"
                name="pickup_date"
                type="date"
                required
              />
            </div>
            <div class="field">
              <label for="pickup-time">Time window</label
              ><select
                class="input"
                id="pickup-time"
                name="pickup_time"
                required
              >
                <option value="">Choose a time</option>
                <option>8:00 AM – 11:00 AM</option>
                <option>11:00 AM – 2:00 PM</option>
                <option>2:00 PM – 5:00 PM</option>
                <option>5:00 PM – 8:00 PM</option>
              </select>
            </div>
          </section>
          <section class="card">
            <h2>Pickup address</h2>
            <!--
              The signed-in customer's saved addresses are loaded from GET /api/account/addresses
              by the script at the bottom of this page and added here, one radio row each.
            -->
            <div id="pickup-addresses">
              <p class="muted" id="pickup-addresses-status">Loading your saved addresses…</p>
            </div>
            <!-- Shown by the script only when the customer has no saved address; opens the pop-up below. -->
            <button class="custom_button custom_button_bg" type="button" id="add-address-button" hidden>+ Add address</button>
          </section>
        </div>
        <div class="actions">
          <a
            class="custom_button custom_button_nobg"
            href="new_order_items.html"
            >← Back</a
          ><button class="custom_button custom_button_bg" type="submit">
            Continue
          </button>
        </div>
        <p id="schedule-error" role="alert" hidden></p>
      </form>

      <!--
        Pop-up for adding a first address without leaving the order. Same fields as the address
        form on the profile page (html/account/profile.html) and saved through the same API,
        POST /api/account/addresses. It sits outside the order form because forms cannot be nested.
      -->
      <dialog id="new-address-dialog" class="address-dialog" aria-labelledby="new-address-title">
        <form id="new-address-form">
          <h3 id="new-address-title">Add a new address</h3>
          <div class="field"><label for="address-nickname">Name for this address</label><input class="input" id="address-nickname" required maxlength="50" placeholder="Home, Office…"></div>
          <div class="field"><label for="address-street">Street address</label><input class="input" id="address-street" required maxlength="100" placeholder="18 Temple Road"></div>
          <div class="field"><label for="address-city">City</label><input class="input" id="address-city" required maxlength="30" placeholder="Colombo 05"></div>
          <div class="field"><label for="address-state">Province</label><input class="input" id="address-state" required maxlength="30" placeholder="Western"></div>
          <div class="field"><label for="address-instructions">Delivery instructions (optional)</label><input class="input" id="address-instructions" maxlength="250" placeholder="For example: call at the gate"></div>
          <p id="new-address-error" class="profile-message error" role="alert" hidden></p>
          <div class="actions">
            <button class="custom_button custom_button_bg" type="submit" id="new-address-save">Save address</button>
            <button class="custom_button custom_button_nobg" type="button" id="new-address-cancel">Cancel</button>
          </div>
        </form>
      </dialog>
    </main>
    <script>
      (function () {
        const key = "laundryLink.orderDraft";
        const form = document.querySelector("main form");
        const error = document.getElementById("schedule-error");
        // Validate and restore only the customer pickup scheduling fields.
        const fields = ["pickup-date", "pickup-time"].map(id => document.getElementById(id));
        const [pickupDate, pickupTime] = fields;
        const readDraft = () => {
          try { return JSON.parse(sessionStorage.getItem(key)) || {}; }
          catch (_) { return {}; }
        };
        const schedule = readDraft().schedule || {};
        fields.forEach((field, index) => { field.value = schedule[["date", "time"][index]] || ""; });
        // Tick the remembered address once the customer's saved addresses have been loaded.
        function restoreAddressChoice() {
          const remembered = readDraft().schedule?.address;
          if (!remembered) return;
          form.querySelectorAll("input[name=address]").forEach(input => {
            if (input.value === String(remembered)) input.checked = true;
          });
        }

        // Pickup addresses: ask the server for the signed-in customer's saved addresses and
        // show each one as a radio row. The API works out who the customer is from the login
        // session, so no customer ID is sent.
        const addressList = document.getElementById("pickup-addresses");
        const addressStatus = document.getElementById("pickup-addresses-status");
        // "18 Temple Road, Colombo 05, Western" - skips any part the customer left empty.
        const addressLine = address => [address.street, address.city, address.state]
          .map(part => (part || "").trim()).filter(Boolean).join(", ");
        const addAddressButton = document.getElementById("add-address-button");
        // Adds one saved address to the list as a radio row and returns its radio button.
        function addAddressRow(address) {
          // Built with DOM nodes (not innerHTML) so text typed by the customer is never run as HTML.
          const row = document.createElement("label");
          row.className = "radio_row";
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "address";
          radio.value = String(address.addressID);
          // The customer's default address starts selected.
          radio.checked = Boolean(address.isDefault);
          const text = document.createElement("span");
          const nickname = document.createElement("strong");
          nickname.textContent = address.nickname || "Saved address";
          const line = document.createElement("span");
          line.className = "muted";
          line.textContent = addressLine(address);
          text.append(nickname, document.createElement("br"), line);
          row.append(radio, text);
          addressList.append(row);
          return radio;
        }
        function showAddresses(addresses) {
          if (!addresses.length) {
            // Nothing to pick from: offer the pop-up so the customer can add an address right here.
            addressStatus.textContent = "You have no saved addresses yet. Add one so we know where to collect your laundry.";
            addAddressButton.hidden = false;
            return;
          }
          addressStatus.remove();
          addresses.forEach(addAddressRow);
          // A choice made earlier in this order wins over the default; then keep the draft in step.
          restoreAddressChoice();
          save();
        }
        fetch("/api/account/addresses", { headers: { Accept: "application/json" }, credentials: "same-origin" })
          .then(response => {
            // A signed-out visitor is redirected to the login page, which is not JSON.
            const isJson = (response.headers.get("content-type") || "").includes("application/json");
            if (!response.ok || !isJson) throw new Error("Addresses could not be loaded.");
            return response.json();
          })
          .then(showAddresses)
          .catch(() => {
            addressStatus.textContent = "We could not load your saved addresses. Please sign in again or try later.";
          });

        // ---- Add-address pop-up (only reachable when the customer has no saved address) ----
        const addressDialog = document.getElementById("new-address-dialog");
        const addressForm = document.getElementById("new-address-form");
        const addressFormError = document.getElementById("new-address-error");
        const addressField = id => document.getElementById(id).value.trim();
        addAddressButton.addEventListener("click", () => addressDialog.showModal());
        document.getElementById("new-address-cancel").addEventListener("click", () => addressDialog.close());
        // Runs however the pop-up closes (Save, Cancel or the Esc key), so it always reopens empty.
        addressDialog.addEventListener("close", () => {
          addressForm.reset();
          addressFormError.hidden = true;
        });
        addressForm.addEventListener("submit", async event => {
          event.preventDefault();
          if (!addressForm.reportValidity()) return;
          const saveButton = document.getElementById("new-address-save");
          saveButton.disabled = true;
          addressFormError.hidden = true;
          try {
            // Spring Security needs this token on every request that changes something.
            const csrf = await fetch("/api/auth/csrf", { credentials: "same-origin" }).then(response => response.json());
            const response = await fetch("/api/account/addresses", {
              method: "POST",
              headers: { Accept: "application/json", "Content-Type": "application/json", [csrf.headerName]: csrf.token },
              credentials: "same-origin",
              body: JSON.stringify({
                nickname: addressField("address-nickname"),
                street: addressField("address-street"),
                city: addressField("address-city"),
                state: addressField("address-state"),
                deliveryInstructions: addressField("address-instructions") || null,
                // It is the customer's only address, so it is also their default.
                isDefault: true
              })
            });
            // A session that has expired is redirected to the login page.
            if (response.redirected) {
              window.location.href = "/html/auth/login.html";
              return;
            }
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.message || "Something went wrong. Please try again.");
            // Show the new address in the list, already selected, and let the customer carry on.
            addressStatus.remove();
            addAddressButton.hidden = true;
            addAddressRow(result).checked = true;
            addressDialog.close();
            validate(false);
            save();
          } catch (problem) {
            addressFormError.textContent = problem.message;
            addressFormError.hidden = false;
          } finally {
            saveButton.disabled = false;
          }
        });
        function save() {
          const draft = readDraft();
          sessionStorage.setItem(key, JSON.stringify({ ...draft, schedule: {
            date: pickupDate.value, time: pickupTime.value,
            address: form.querySelector("input[name=address]:checked")?.value
          } }));
        }
        const isoDate = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        // Minutes after midnight at which a time window option starts, e.g. "2:00 PM – 5:00 PM" -> 840.
        function slotStart(option) {
          const match = /^(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(option.textContent.trim());
          if (!match) return null;
          return (Number(match[1]) % 12 + (match[3].toUpperCase() === "PM" ? 12 : 0)) * 60 + Number(match[2]);
        }
        // A scheduling slot can only be booked if it has not started yet. For today's date, grey out
        // (disable) every window whose start time has already passed, and clear the selection if it
        // was one of them. Other dates keep all windows. Returns true if any window is still open today.
        function limitSlots(dateField, timeField, today, nowMinutes) {
          let anyOpenToday = false;
          Array.from(timeField.options).forEach(option => {
            const start = slotStart(option);
            if (start === null) return; // the "Choose a time" placeholder
            const passed = start <= nowMinutes;
            if (!passed) anyOpenToday = true;
            option.disabled = dateField.value === today && passed;
          });
          if (timeField.selectedOptions[0]?.disabled) timeField.value = "";
          return anyOpenToday;
        }
        function validate(showMissing) {
          const now = new Date();
          const today = isoDate(now);
          // Clamp the same day to the last day of next month (for example, January 31 to February 28).
          const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
          const lastDay = new Date(nextMonth.getFullYear(), nextMonth.getMonth() + 1, 0).getDate();
          nextMonth.setDate(Math.min(now.getDate(), lastDay));
          const nowMinutes = now.getHours() * 60 + now.getMinutes();
          pickupDate.min = today;
          pickupDate.max = isoDate(nextMonth);
          limitSlots(pickupDate, pickupTime, today, nowMinutes);
          fields.forEach(field => field.setCustomValidity(""));
          const labels = ["pickup date", "pickup time window"];
          fields.forEach((field, index) => {
            if (!field.value) field.setCustomValidity(`Please select a ${labels[index]}.`);
          });
          if (pickupDate.value) {
            const outsideRange = pickupDate.value < pickupDate.min || pickupDate.value > pickupDate.max;
            const differentYear = Number(pickupDate.value.split("-")[0]) !== now.getFullYear();
            if (pickupDate.value > pickupDate.max || (differentYear && outsideRange)) {
              pickupDate.setCustomValidity("Pickup can only be scheduled up to one month in advance.");
            } else if (pickupDate.value < pickupDate.min) {
              pickupDate.setCustomValidity("Please choose today or a future date.");
            }
          }
          const invalid = fields.find(field => !field.validity.valid && (showMissing || field.value));
          // A pickup address is required too. Like the other missing fields, it is only reported
          // once the customer tries to continue. No radio rows at all means nothing is saved yet
          // (or the list failed to load), so the message asks for an address to be added instead.
          const addressChosen = Boolean(form.querySelector("input[name=address]:checked"));
          let message = invalid ? invalid.validationMessage : "";
          if (!message && showMissing && !addressChosen) {
            message = form.querySelector("input[name=address]")
              ? "Please select a pickup address."
              : "Please add a pickup address before continuing.";
          }
          error.textContent = message;
          error.hidden = !message;
          return addressChosen && !fields.some(field => !field.validity.valid);
        }
        form.noValidate = true;
        // Validate before saving so a time window cleared by the slot limits is not kept in the draft.
        form.addEventListener("input", () => { validate(false); save(); });
        form.addEventListener("change", () => { validate(false); save(); });
        window.addEventListener("pagehide", save);
        form.addEventListener("submit", event => {
          event.preventDefault();
          if (!validate(true) || !form.checkValidity()) {
            form.reportValidity();
            return;
          }
          save();
          window.location.href = "new_order_instructions.html";
        });
        validate(false);
        save(); // Also discard obsolete scheduling selections from older drafts.
        // Re-check every minute so a page left open greys out windows as they start.
        setInterval(() => { validate(false); save(); }, 60 * 1000);
      })();
    </script>
  </body>
</html>
