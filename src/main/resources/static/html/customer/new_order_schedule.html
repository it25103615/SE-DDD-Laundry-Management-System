<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schedule Pickup | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>

  </head>
  <body>
    <nav class="dashboard_nav">
      <ul class="navigation">
        <li class="logo">
          <a href="dashboard.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="dashboard.html">Cancel order</a
          ><span class="profile_badge">PF</span>
        </li>
      </ul>
    </nav>
    <main>
      <header class="page_header">
        <div class="subtitle">NEW ORDER</div>
        <h1>When and where?</h1>
        <p>Choose a pickup slot and confirm the collection address.</p>
      </header>
      <ol class="step_list">
        <li class="done">1 Services</li>
        <li class="done">2 Items</li>
        <li class="active">3 Schedule</li>
        <li>4 Instructions</li>
        <li>5 Review</li>
      </ol>
      <form action="new_order_instructions.html" method="get">
        <div class="grid grid_two">
          <div>
          <section class="card">
            <h2>Pickup time</h2>
            <div class="field">
              <label for="pickup-date">Date</label
              ><input
                class="input"
                id="pickup-date"
                name="pickup_date"
                type="date"
                required
              />
            </div>
            <div class="field">
              <label for="pickup-time">Time window</label
              ><select
                class="input"
                id="pickup-time"
                name="pickup_time"
                required
              >
                <option value="">Choose a time</option>
                <option>8:00 AM – 11:00 AM</option>
                <option>11:00 AM – 2:00 PM</option>
                <option>2:00 PM – 5:00 PM</option>
                <option>5:00 PM – 8:00 PM</option>
              </select>
            </div>
          </section>
          <section class="card" style="margin-top: 22px">
            <h2>Delivery time</h2>
            <div class="field">
              <label for="delivery-date">Date</label
              ><input
                class="input"
                id="delivery-date"
                name="delivery_date"
                type="date"
                required
              />
            </div>
            <div class="field">
              <label for="delivery-time">Time window</label
              ><select
                class="input"
                id="delivery-time"
                name="delivery_time"
                required
              >
                <option value="">Choose a time</option>
                <option>8:00 AM – 11:00 AM</option>
                <option>11:00 AM – 2:00 PM</option>
                <option>2:00 PM – 5:00 PM</option>
                <option>5:00 PM – 8:00 PM</option>
              </select>
            </div>
          </section>
          </div>
          <section class="card">
            <h2>Pickup address</h2>
            <label class="radio_row"
              ><input type="radio" name="address" value="home" checked /><span
                ><strong>Home</strong><br /><span class="muted"
                  >24 Flower Road, Colombo 07</span
                ></span
              ></label
            ><label class="radio_row"
              ><input type="radio" name="address" value="other" /><span
                ><strong>Use another address</strong><br /><span class="muted"
                  >Add a different pickup location</span
                ></span
              ></label
            >
          </section>
        </div>
        <div class="actions">
          <a
            class="custom_button custom_button_nobg"
            href="new_order_items.html"
            >← Back</a
          ><button class="custom_button custom_button_bg" type="submit">
            Continue
          </button>
        </div>
        <p id="schedule-error" role="alert" hidden></p>
      </form>
    </main>
    <script>
      (function () {
        const key = "laundryLink.orderDraft";
        const form = document.querySelector("main form");
        const error = document.getElementById("schedule-error");
        const fields = ["pickup-date", "pickup-time", "delivery-date", "delivery-time"].map(id => document.getElementById(id));
        const [pickupDate, pickupTime, deliveryDate, deliveryTime] = fields;
        const readDraft = () => {
          try { return JSON.parse(sessionStorage.getItem(key)) || {}; }
          catch (_) { return {}; }
        };
        const schedule = readDraft().schedule || {};
        fields.forEach((field, index) => { field.value = schedule[["date", "time", "deliveryDate", "deliveryTime"][index]] || ""; });
        form.querySelectorAll("input[name=address]").forEach(input => {
          if (schedule.address) input.checked = input.value === schedule.address;
        });
        function save() {
          const draft = readDraft();
          sessionStorage.setItem(key, JSON.stringify({ ...draft, schedule: {
            ...draft.schedule, date: pickupDate.value, time: pickupTime.value,
            deliveryDate: deliveryDate.value, deliveryTime: deliveryTime.value,
            address: form.querySelector("input[name=address]:checked")?.value
          } }));
        }
        function validate(showMissing) {
          const now = new Date();
          const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
          pickupDate.min = deliveryDate.min = today;
          fields.forEach(field => field.setCustomValidity(""));
          const labels = ["pickup date", "pickup time window", "delivery date", "delivery time window"];
          fields.forEach((field, index) => {
            if (!field.value) field.setCustomValidity(`Please select a ${labels[index]}.`);
          });
          [pickupDate, deliveryDate].forEach(field => {
            if (field.value && field.value < today) field.setCustomValidity("Please choose today or a future date.");
          });
          if (fields.every(field => field.value) && (deliveryDate.value < pickupDate.value
              || (deliveryDate.value === pickupDate.value && deliveryTime.selectedIndex <= pickupTime.selectedIndex))) {
            deliveryTime.setCustomValidity("Delivery must be after pickup. Choose a later date or time window.");
          }
          const invalid = fields.find(field => !field.validity.valid && (showMissing || field.value));
          error.textContent = invalid ? invalid.validationMessage : "";
          error.hidden = !invalid;
          return !fields.some(field => !field.validity.valid);
        }
        form.noValidate = true;
        form.addEventListener("input", () => { save(); validate(false); });
        form.addEventListener("change", () => { save(); validate(false); });
        window.addEventListener("pagehide", save);
        form.addEventListener("submit", event => {
          event.preventDefault();
          if (!validate(true) || !form.checkValidity()) {
            form.reportValidity();
            return;
          }
          save();
          window.location.href = "new_order_instructions.html";
        });
        validate(false);
      })();
    </script>
  </body>
</html>
