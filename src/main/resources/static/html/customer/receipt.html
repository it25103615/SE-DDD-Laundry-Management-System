<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Receipt | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/dashboard.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
    <script src="../../js/customer/payment-flow.js" defer></script>
  </head>
  <body data-payment-page="receipt">
    <nav class="dashboard_nav">
      <ul class="navigation">
        <li class="logo">
          <a href="dashboard.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="payments.html">Payments</a
          ><a href="../portal.html">Switch Portal</a>
        </li>
      </ul>
    </nav>
    <main>
      <header class="welcome_banner" style="margin-top: 34px">
        <h1 id="receipt-title">Payment recorded</h1>
        <p id="receipt-reference">Receipt</p>
      </header>
      <section class="card" style="max-width: 680px; margin: 24px auto">
        <p id="receipt-order">Order</p>
        <div class="top_bar">
          <h2>Total paid</h2>
          <h2 id="receipt-amount">Loading...</h2>
        </div>
        <p class="muted" id="receipt-method">Payment method</p>
        <p class="muted" id="receipt-time">Payment time</p>
        <a class="custom_button custom_button_bg" id="receipt-payments-link" href="payments.html"
          >Back to payments</a
        >
      </section>
    </main>
  </body>
</html>
