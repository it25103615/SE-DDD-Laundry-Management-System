<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LaundryLink</title>
    <!-- Connect CSS file -->
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/forgot_password_request.css" />
  </head>
  <body>
    <div class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="#"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right" style="display: flex">
          <a href="#">Services</a>
          <a href="#">Pricing</a>
        </li>
      </ul>
    </div>
    <div class="main">
      <div class="main_inner">
        <h1>Reset your password</h1>
        <p class="welcome_para">
          Enter your email and we'll send a reset link.
        </p>

        <div id="forgot_password_request_form">
          <div class="field">
            <label>Email</label>
            <input
              id="email"
              class="input"
              type="email"
              placeholder="you@email.com"
            />
          </div>
        </div>

        <a class="reset custom_button custom_button_bg" href="#">
          Send reset link
        </a>

        <div class="to_login_prompt">
          <a class="link" href="#">← Back to log in</a>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="trademark">
        <p>© 2026 LaundryLink</p>
      </div>
      <div class="quick_links">
        <a href="#"> About </a>
        <a href="#"> Contact </a>
        <a href="#"> Terms </a>
      </div>
    </div>
  </body>
</html>
