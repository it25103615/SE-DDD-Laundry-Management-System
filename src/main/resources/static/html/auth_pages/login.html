<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LaundryLink</title>
    <!-- Connect CSS file -->
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/login.css" />
  </head>
  <body>
    <div class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="#"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right" style="display: flex">
          <a href="#">Services</a>
          <a href="#">Pricing</a>
        </li>
      </ul>
    </div>
    <div class="main">
      <div class="main_inner">
        <h1>Welcome back</h1>
        <p class="welcome_para">Log in to manage your orders.</p>

        <div id="login_form">
          <div class="field">
            <label>Email</label>
            <input
              id="email"
              class="input"
              type="email"
              placeholder="you@email.com"
            />
          </div>
          <div class="field">
            <label>Password</label>
            <input
              id="password"
              class="input"
              type="password"
              placeholder="••••••••"
            />
          </div>
        </div>

        <div class="forget_pass">
          <a class="link" href="#">Forgot Password?</a>
        </div>

        <a class="login custom_button custom_button_bg" href="#"> Log In </a>

        <div class="create_account_prompt">
          <p>New to LaundryLink?</p>
          <a class="link" href="#">Create an account</a>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="trademark">
        <p>© 2026 LaundryLink</p>
      </div>
      <div class="quick_links">
        <a href="#"> About </a>
        <a href="#"> Contact </a>
        <a href="#"> Terms </a>
      </div>
    </div>
  </body>
</html>
