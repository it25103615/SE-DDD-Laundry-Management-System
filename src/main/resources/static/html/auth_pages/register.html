<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LaundryLink</title>
    <!-- Connect CSS file -->
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/register.css" />
  </head>
  <body>
    <div class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="#"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right" style="display: flex">
          <a href="#">Services</a>
          <a href="#">Pricing</a>
        </li>
      </ul>
    </div>
    <div class="main">
      <div class="main_inner">
        <h1>Create your account</h1>
        <p class="welcome_para">
          Book your first pickup in a couple of minutes.
        </p>

        <div id="register_form">
          <div class="small_fields">
            <div class="field">
              <label>Full Name</label>
              <input id="name" class="input" placeholder="John Smith" />
            </div>
            <div class="field">
              <label>Phone Number</label>
              <input
                id="phonenumber"
                class="input"
                placeholder="+94 77 123 4567"
              />
            </div>
          </div>
          <div class="field">
            <label>Email</label>
            <input
              id="email"
              class="input"
              type="email"
              placeholder="you@email.com"
            />
          </div>
          <div class="field">
            <label>Password</label>
            <input
              id="password"
              class="input"
              type="password"
              placeholder="At least 8 characters"
            />
          </div>
          <div class="field">
            <label>Delivery address (optional)</label>
            <input
              id="address"
              class="input"
              placeholder="You can add this later too"
            />
          </div>
        </div>

        <a class="create_account custom_button custom_button_bg" href="#">
          Create Account
        </a>

        <div class="create_account_prompt">
          <p>Already have an account?</p>
          <a class="link" href="#">Log in</a>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="trademark">
        <p>© 2026 LaundryLink</p>
      </div>
      <div class="quick_links">
        <a href="#"> About </a>
        <a href="#"> Contact </a>
        <a href="#"> Terms </a>
      </div>
    </div>
  </body>
</html>
