<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>LaundryLink</title>
    <!-- Connect CSS file -->
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/forgot_password_change.css" />
  </head>
  <body>
    <div class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="#"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right" style="display: flex">
          <a href="#">Services</a>
          <a href="#">Pricing</a>
        </li>
      </ul>
    </div>
    <div class="main">
      <div class="main_inner">
        <h1>Choose a new password</h1>
        <p class="welcome_para">Almost done — set a new password.</p>

        <div id="forgot_password_change_form">
          <div class="field">
            <label>New password</label>
            <input
              id="password"
              class="input"
              type="password"
              placeholder="At least 8 characters"
            />
          </div>
          <div class="field">
            <label>Confirm new password</label>
            <input
              id="password"
              class="input"
              type="password"
              placeholder="Re-enter password"
            />
          </div>
        </div>

        <a class="update custom_button custom_button_bg" href="#">
          Update password
        </a>
      </div>
    </div>
    <div class="footer">
      <div class="trademark">
        <p>© 2026 LaundryLink</p>
      </div>
      <div class="quick_links">
        <a href="#"> About </a>
        <a href="#"> Contact </a>
        <a href="#"> Terms </a>
      </div>
    </div>
  </body>
</html>
