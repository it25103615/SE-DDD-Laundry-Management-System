<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opening workspace | LaundryLink</title><link rel="stylesheet" href="../css/global.css"></head>
<body><main><section class="card" style="max-width:560px;margin:80px auto"><h1>Opening your workspace…</h1><p>Checking your signed-in account.</p></section></main>
<script>
fetch('/api/support/context').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(({actor})=>{
 const destinations={CUSTOMER:'/html/customer/dashboard.html',RIDER:'/html/rider/dashboard.html',STAFF:'/html/staff/dashboard.html',MANAGER:'/html/admin/manager/dashboard.html',CSM:'/html/admin/customer-service-manager/dashboard.html',CUSTOMER_SERVICE_MANAGER:'/html/admin/customer-service-manager/dashboard.html',OWNER:'/html/admin/owner/dashboard.html',ADMIN:'/html/admin/owner/dashboard.html'};
 location.replace(destinations[actor.role]||'/');
}).catch(()=>location.replace('/html/auth/login.html'));
</script></body></html>
