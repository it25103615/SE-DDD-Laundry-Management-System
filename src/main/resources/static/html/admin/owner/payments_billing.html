<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Payments & Billing | LaundryLink</title>
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../../../css/dashboard.css" />
    <script src="../../../js/global-pre.js"></script>
    <script src="../../../js/global-post.js" defer></script>
    <script src="../../../js/admin/payment-management.js" defer></script>
  </head>
  <body data-payment-admin-page="list">
    <nav class="dashboard_nav"></nav>
    <main>
      <header class="page_header">
        <div class="subtitle">FINANCE</div>
        <h1>Payments &amp; Billing</h1>
        <p>Monitor collections, outstanding balances and billing exceptions.</p>
      </header>
      <section class="grid grid_three">
        <article class="card metric">
          <span class="muted small">TOTAL COLLECTED</span
          ><strong id="collected-total">Loading...</strong>
        </article>
        <article class="card metric">
          <span class="muted small">OUTSTANDING</span
          ><strong id="outstanding-total">Loading...</strong>
        </article>
        <article class="card metric">
          <span class="muted small">FAILED PAYMENTS</span><strong id="failed-total">Loading...</strong>
        </article>
      </section>
      <form id="payment-filters" class="card" style="margin-top: 30px">
        <div class="grid grid_two">
          <div class="field">
            <label for="payment-search">Search</label>
            <input class="input" id="payment-search" name="search" type="search" placeholder="Payment, order, customer or status" />
          </div>
          <div class="field">
            <label for="payment-status-filter">Payment status</label>
            <select class="input" id="payment-status-filter" name="status">
              <option value="">All</option>
              <option value="UNPAID">UNPAID</option>
              <option value="PAID">PAID</option>
              <option value="VERIFIED">VERIFIED</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </div>
        </div>
        <div class="grid grid_two">
          <div class="field">
            <label for="payment-method-filter">Payment method</label>
            <select class="input" id="payment-method-filter" name="method">
              <option value="">All methods</option>
              <option value="CARD">CARD</option>
              <option value="CASH">CASH</option>
            </select>
          </div>
          <div class="field">
            <label for="order-id-filter">Order ID</label>
            <input class="input" id="order-id-filter" name="orderID" type="number" min="1" step="1" />
          </div>
        </div>
        <div class="grid grid_two">
          <div class="field">
            <label for="customer-id-filter">Customer ID</label>
            <input class="input" id="customer-id-filter" name="customerID" type="number" min="1" step="1" />
          </div>
        </div>
        <div class="actions">
          <button class="custom_button custom_button_bg" type="submit">Search</button>
          <button class="custom_button custom_button_nobg" id="clear-payment-filters" type="button">Clear</button>
        </div>
      </form>
      <div class="table_wrap" style="margin-top: 30px">
        <table>
          <thead>
            <tr>
              <th>PAYMENT</th>
              <th>ORDER</th>
              <th>CUSTOMER</th>
              <th>AMOUNT</th>
              <th>METHOD</th>
              <th>STATUS</th>
              <th>DATE</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="manager-payment-table">
            <tr>
              <td colspan="8">Loading payment records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
