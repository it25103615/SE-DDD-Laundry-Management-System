<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Payments &amp; Billing | LaundryLink</title>
    <link rel="stylesheet" href="../../../css/global.css" />
    <link rel="stylesheet" href="../../../css/dashboard.css" />
    <script src="../../../js/global-pre.js"></script>
    <script src="../../../js/global-post.js" defer></script>
    <script src="../../../js/admin/payment-management.js" defer></script>
  </head>
  <body data-payment-admin-page="list">
    <nav class="dashboard_nav">
      <ul class="navigation">
        <li class="logo">
          <a href="administration_overview.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="administration_overview.html">Dashboard</a
          ><a href="payments_billing.html">Payments &amp; Billing</a
          ><a href="reports.html">Reports</a
          ><span class="profile_badge">AD</span>
        </li>
      </ul>
    </nav>
    <main>
      <header class="page_header">
        <div class="subtitle">FINANCE</div>
        <h1>Payments &amp; Billing</h1>
        <p>Monitor collections, outstanding balances and billing exceptions.</p>
      </header>
      <section class="grid grid_three">
        <article class="card metric">
          <span class="muted small">COLLECTED TODAY</span
          ><strong id="collected-total">Loading...</strong>
        </article>
        <article class="card metric">
          <span class="muted small">OUTSTANDING</span
          ><strong id="outstanding-total">Loading...</strong>
        </article>
        <article class="card metric">
          <span class="muted small">FAILED PAYMENTS</span><strong id="failed-total">Loading...</strong>
        </article>
      </section>
      <div class="table_wrap" style="margin-top: 30px">
        <table>
          <thead>
            <tr>
              <th>ORDER</th>
              <th>CUSTOMER</th>
              <th>METHOD</th>
              <th>AMOUNT</th>
              <th>STATUS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="manager-payment-table">
            <tr>
              <td colspan="6">Loading payment records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
