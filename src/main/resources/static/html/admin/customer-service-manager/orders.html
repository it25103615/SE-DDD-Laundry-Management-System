<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order lookup | LaundryLink</title>
<link rel="stylesheet" href="../../../css/global.css">
<link rel="stylesheet" href="../../../css/dashboard.css">
<link rel="stylesheet" href="../../../css/support/support.css">
<script src="../../../js/global-pre.js" defer>
</script>
<script src="../../../js/support/common.js" defer>
</script>
<script src="../../../js/support/orders.js" defer>
</script>
</head>
<body data-page="orders">
<nav class="dashboard_nav">
<ul class="navigation">
<li class="logo">
<a href="/html/portal.html">
<h3>LaundryLink</h3>
</a>
</li>
<li class="nav_right">
<a href="/html/admin/owner/administration_overview.html">Overview</a>
<a href="/html/admin/customer-service-manager/complaints.html">Support cases</a>
<a href="/html/admin/customer-service-manager/orders.html">Order lookup</a>
<a href="/html/admin/owner/reports.html">Reports</a>
<a href="/html/admin/manager/system_settings.html">Settings</a>
</li>
</ul>
</nav>
<main class="support-page">
<header class="page_header">
<div class="subtitle">ADMINISTRATION</div>
<h1>Order lookup</h1>
<p id="identity">Connecting…</p>
</header>
<div id="notice" class="notice" role="status" aria-live="polite" hidden>
</div>
<form id="order-search" class="toolbar">
<div class="field">
<label for="order-id">Order ID (leave empty for all)</label>
<input class="input" id="order-id" type="number" min="1" step="1">
</div>
<button class="custom_button custom_button_bg" type="submit">Find orders</button>
</form>
<div class="table_wrap">
<table>
<thead>
<tr>
<th>Order</th>
<th>Customer</th>
<th>Status</th>
<th>Order value</th>
<th>History</th>
</tr>
</thead>
<tbody id="orders">
</tbody>
</table>
</div>
<div class="actions">
<button class="custom_button" id="previous">Previous</button>
<span id="page-label">
</span>
<button class="custom_button" id="next">Next</button>
</div>
<section class="card section" id="order-history" hidden>
<h2 id="history-title">Order history</h2>
<div id="history">
</div>
</section>
</main>
</body>
</html>
