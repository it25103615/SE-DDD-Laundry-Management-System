<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Log In | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body class="auth_body">
    <nav class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="../index.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="../public/services.html">Services</a
          ><a href="../public/pricing.html">Pricing</a>
        </li>
      </ul>
    </nav>
    <main class="auth_main">
      <section class="auth_panel">
        <div class="subtitle">WELCOME BACK</div>
        <h1>Log in</h1>
        <p class="muted">Log in to manage your orders.</p>
        <div
          id="login-error"
          class="alert alert_error form_message"
          role="alert"
        >
          We could not log you in. Check your email and password.
        </div>
        <form action="../portal.html" method="get">
          <div class="field">
            <label for="email">Email</label
            ><input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@email.com"
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              class="input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
            />
          </div>
          <p style="text-align: right">
            <a class="link small" href="forgot_password.html"
              >Forgot password?</a
            >
          </p>
          <button class="custom_button custom_button_bg" type="submit">
            Log In
          </button>
        </form>
        <p class="auth_prompt">
          New to LaundryLink?
          <a class="link" href="register.html">Create an account</a>
        </p>
      </section>
    </main>
    <footer class="footer"><p>© 2026 LaundryLink</p></footer>
  </body>
</html>
