<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body class="auth_body">
    <nav class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="../../index.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="../public/services.html">Services</a
          ><a href="../public/pricing.html">Pricing</a>
        </li>
      </ul>
    </nav>
    <main class="auth_main">
      <section class="auth_panel">
        <div class="subtitle">ACCOUNT RECOVERY</div>
        <h1>Reset your password</h1>
        <p class="muted">Enter your email and we will send a reset link.</p>
        <div id="sent" class="alert alert_success form_message" role="status">
          Reset link sent. Check your email.
        </div>
        <form action="#sent">
          <div class="field">
            <label for="email">Email</label
            ><input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@email.com"
            />
          </div>
          <button class="custom_button custom_button_bg" type="submit">
            Send reset link
          </button>
        </form>
        <p class="auth_prompt">
          <a class="link" href="login.html">← Back to log in</a>
        </p>
      </section>
    </main>
  </body>
</html>
