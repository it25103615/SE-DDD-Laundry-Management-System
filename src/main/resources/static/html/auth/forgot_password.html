<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
    <meta name="referrer" content="no-referrer" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
    <script src="../../js/auth/password-recovery.js" defer></script>
  </head>
  <body class="auth_body">
    <nav class="navbar"></nav>
    <main class="auth_main">
      <section class="auth_panel">
        <div class="subtitle">ACCOUNT RECOVERY</div>
        <h1>Reset your password</h1>
        <p class="muted">
          Enter your account email. We’ll email a six-digit code that expires in 10 minutes.
        </p>
        <div id="recovery-message" class="alert form_message" role="status" hidden></div>
        <form id="forgot-password-form" method="post">
          <div class="field">
            <label for="email">Email</label
            ><input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="100"
              placeholder="you@email.com"
            />
          </div>
          <button class="custom_button custom_button_bg" type="submit">Send verification code</button>
        </form>
        <form id="verify-code-form" method="post" hidden>
          <div class="field">
            <label for="recovery-code">Email verification code</label>
            <input class="input" id="recovery-code" name="code" type="text" inputmode="numeric"
              autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required
              placeholder="Six-digit code" />
          </div>
          <button class="custom_button custom_button_bg" type="submit">Verify code</button>
          <button class="custom_button" id="request-new-code" type="button">Request another code</button>
        </form>
        <form id="reset-password-form" method="post" hidden>
          <p class="muted">Use 8–72 characters with uppercase, lowercase, a number and a special character, without spaces.</p>
          <div class="field">
            <label for="new-password">New password</label>
            <input class="input" id="new-password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input class="input" id="confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
          </div>
          <button class="custom_button custom_button_bg" type="submit">Update password</button>
        </form>
        <p class="auth_prompt"><a class="link" href="login.html">← Back to log in</a></p>
      </section>
    </main>
  </body>
</html>
