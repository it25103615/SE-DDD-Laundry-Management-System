<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | LaundryLink</title>
<link rel="stylesheet" href="../../css/global.css"><link rel="stylesheet" href="../../css/auth/auth.css">
<meta name="referrer" content="no-referrer">

</head><body class="auth_body"><nav class="navbar"></nav><main class="auth_main"><section class="auth_panel">
