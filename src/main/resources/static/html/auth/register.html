<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body class="auth_body">
    <nav class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="../index.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="../public/services.html">Services</a
          ><a href="../public/pricing.html">Pricing</a>
        </li>
      </ul>
    </nav>
    <main class="auth_main">
      <section class="auth_panel">
        <div class="subtitle">GET STARTED</div>
        <h1>Create your account</h1>
        <p class="muted">Book your first pickup in a couple of minutes.</p>
        <form action="../customer/dashboard.html" method="get">
          <div class="grid grid_two">
            <div class="field">
              <label for="name">Full name</label
              ><input
                class="input"
                id="name"
                name="name"
                autocomplete="name"
                required
                placeholder="John Smith"
              />
            </div>
            <div class="field">
              <label for="phone">Phone number</label
              ><input
                class="input"
                id="phone"
                name="phone"
                type="tel"
                autocomplete="tel"
                required
                placeholder="+94 77 123 4567"
              />
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label
            ><input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@email.com"
            />
          </div>
          <div class="field">
            <label for="password">Password</label
            ><input
              class="input"
              id="password"
              name="password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
              placeholder="At least 8 characters"
            />
          </div>
          <div class="password_strength">
            <div class="top_bar small">
              <span>Password strength</span><span class="link">Good</span>
            </div>
            <div class="progress" aria-label="Password strength: good">
              <span style="width: 72%"></span>
            </div>
          </div>
          <div class="field">
            <label for="address">Delivery address (optional)</label
            ><input
              class="input"
              id="address"
              name="address"
              autocomplete="street-address"
              placeholder="You can add this later too"
            />
          </div>
          <label class="check_row"
            ><input type="checkbox" required />I agree to the Terms and Privacy
            Policy.</label
          ><button class="custom_button custom_button_bg" type="submit">
            Create account
          </button>
        </form>
        <p class="auth_prompt">
          Already have an account? <a class="link" href="login.html">Log in</a>
        </p>
      </section>
    </main>
    <footer class="footer"><p>© 2026 LaundryLink</p></footer>
  </body>
</html>
