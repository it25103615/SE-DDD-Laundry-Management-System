<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Choose New Password | LaundryLink</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../../css/auth/auth.css" />
    <script src="../../js/global-pre.js"></script>
    <script src="../../js/global-post.js" defer></script>
  </head>
  <body class="auth_body">
    <nav class="navbar">
      <ul class="navigation">
        <li class="logo">
          <a href="../index.html"><h3>LaundryLink</h3></a>
        </li>
        <li class="nav_right">
          <a href="../public/services.html">Services</a
          ><a href="../public/pricing.html">Pricing</a>
        </li>
      </ul>
    </nav>
    <main class="auth_main">
      <section class="auth_panel">
        <div class="subtitle">ALMOST DONE</div>
        <h1>Choose a new password</h1>
        <p class="muted">
          Use at least eight characters and avoid a password used elsewhere.
        </p>
        <form action="login.html" method="get">
          <div class="field">
            <label for="new-password">New password</label
            ><input
              class="input"
              id="new-password"
              name="new_password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="password_strength">
            <div class="progress"><span style="width: 72%"></span></div>
            <span class="small muted">Good password</span>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label
            ><input
              class="input"
              id="confirm-password"
              name="confirm_password"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>
          <button class="custom_button custom_button_bg" type="submit">
            Update password
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
